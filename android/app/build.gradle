plugins { id 'com.android.application' }
android {
    namespace 'pl.viamio.monstertap'
    compileSdk 34
    defaultConfig {
        applicationId 'pl.viamio.monstertap'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('monstertap.jks')
            storePassword 'monstertap'
            keyAlias 'monstertap'
            keyPassword 'monstertap'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
