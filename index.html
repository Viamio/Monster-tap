<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14102a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Tap">
<title>Monster Tap</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* =========================================================
   STYLE – podstawy
   ========================================================= */
:root{--panel:rgba(18,14,38,.94);--card:#241d45;--card2:#2f2658;--acc:#ffcc33;--txt:#fff;--mut:#b9b0d9;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0918;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
textarea{user-select:text;-webkit-user-select:text;width:100%;height:120px;border-radius:10px;padding:8px;font-size:12px;background:#120e26;color:#fff;border:1px solid #444;margin:10px 0}
.hidden{display:none!important}
#app{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#1d5a33}

/* Tła światów */
#app.w0{background:radial-gradient(ellipse at 50% 40%,#3f9a5c 0%,#1d5a33 45%,#0b2614 100%)}
#app.w1{background:radial-gradient(ellipse at 50% 30%,#f2c46d 0%,#c47f32 45%,#5a300f 100%)}
#app.w2{background:radial-gradient(ellipse at 50% 30%,#cdeeff 0%,#5aa6dc 40%,#163a60 100%)}
#app.w3{background:radial-gradient(ellipse at 50% 40%,#ff7a3d 0%,#9b1f0e 45%,#2a0604 100%)}
#app.w4{background:radial-gradient(1.5px 1.5px at 15% 20%,#fff,transparent),radial-gradient(1px 1px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 60%,#fff,transparent),radial-gradient(1px 1px at 85% 70%,#fff,transparent),radial-gradient(1px 1px at 25% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 35%,#fff,transparent),radial-gradient(ellipse at 50% 40%,#3b2a7a,#120b2e 55%,#02010a)}

/* Górny pasek walut */
#top{display:flex;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:rgba(0,0,0,.35)}
.cur{flex:1;background:rgba(0,0,0,.4);border-radius:12px;padding:7px 6px;font-size:15px;text-align:center;white-space:nowrap;overflow:hidden}
.cur b{font-weight:800}
main{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;display:none}
.tab.active{display:flex}
.tab.panel.active{display:block}
.panel{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;background:var(--panel)}

/* Dolna nawigacja */
#nav{display:flex;background:#120e26;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgba(255,255,255,.08)}
#nav button{flex:1;height:62px;border:none;background:none;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
#nav button i{font-style:normal;font-size:23px}
#nav button.on{color:var(--acc);background:rgba(255,204,51,.08)}
.dot{position:absolute;top:6px;right:22%;width:11px;height:11px;background:#ef4444;border-radius:50%;border:2px solid #120e26}

/* =========================================================
   STYLE – ekran walki
   ========================================================= */
#tab-fight{flex-direction:column;padding:8px 12px 10px;gap:6px}
#worldBar{display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 3px #000;font-size:15px}
#eventBar{background:rgba(255,120,0,.3);border:1px solid rgba(255,160,60,.6);border-radius:10px;padding:4px 8px;font-size:13px;font-weight:700;text-align:center}
#boosts{display:flex;flex-wrap:wrap;gap:4px;min-height:0;justify-content:center}
.bchip{background:rgba(0,0,0,.5);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
#monsterName{text-align:center;font-weight:800;font-size:17px;text-shadow:0 2px 3px #000}
.bar{position:relative;height:22px;background:rgba(0,0,0,.5);border-radius:11px;overflow:hidden;border:2px solid rgba(255,255,255,.15);flex-shrink:0}
.bar>div{height:100%;width:100%;transition:width .12s}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000;white-space:nowrap}
#hpFill{background:linear-gradient(90deg,#ef4444,#f97316)}
#bossFill{background:linear-gradient(90deg,#a855f7,#ec4899)}
#comboFill{background:linear-gradient(90deg,#22d3ee,#a3e635);transition:width .1s}
#app.frenzy #comboFill{background:linear-gradient(90deg,#f43f5e,#f59e0b,#facc15,#f43f5e);background-size:200% 100%;animation:rainbow 1s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
#nextFill{background:linear-gradient(90deg,#facc15,#f59e0b)}
#arena{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:170px;touch-action:none}
#deco{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:38px;opacity:.28;pointer-events:none;letter-spacing:6px}
#monster{font-size:min(33vw,145px);margin-left:34%;line-height:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));position:relative;pointer-events:none}
#monster.boss{font-size:min(40vw,175px)}
#monster.boss::before{content:'';position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(255,40,80,.45),transparent 65%);animation:pulse 1s ease-in-out infinite alternate;z-index:-1}
#monster.frozen #monsterEmoji{filter:brightness(1.3) saturate(.3) drop-shadow(0 0 14px #7dd3fc)!important}
#monsterEmoji{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.03)}}
@keyframes pulse{to{transform:scale(1.12);opacity:.7}}
.dying{animation:die .38s ease-in forwards}
@keyframes die{to{transform:scale(1.5) rotate(25deg);opacity:0;filter:blur(6px) brightness(3)}}
.spawn{animation:spawn .3s ease-out}
@keyframes spawn{from{transform:scale(.3);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none}
.dmg{position:absolute;font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;animation:dmgUp .8s ease-out forwards;white-space:nowrap;z-index:4}
.dmg.crit{color:var(--acc);font-size:34px}
.dmg.dps{color:#cbd5e1;font-size:15px;opacity:.85}
.dmg.coin{color:#fde047;font-size:22px}
.dmg.big{font-size:42px;color:#fb923c}
@keyframes dmgUp{0%{transform:translate(-50%,0) scale(.6);opacity:1}20%{transform:translate(-50%,-20px) scale(1.15)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:pt .6s ease-out forwards}
.pt.em{width:auto;height:auto;background:none!important;font-size:16px;line-height:1}
.pt.frag{font-size:34px;animation:frag .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes frag{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.coinfly{position:fixed;font-size:22px;pointer-events:none;z-index:90;animation:coinF .9s ease-in forwards}
@keyframes coinF{0%{transform:translate(0,0) scale(.4)}30%{transform:translate(var(--bx),var(--by)) scale(1.15)}100%{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:.5}}
.meteor{position:absolute;font-size:44px;animation:meteor .45s ease-in forwards;pointer-events:none}
@keyframes meteor{from{transform:translate(160px,-260px)}to{transform:translate(0,0)}}
/* Szał – świecenie ekranu */
#app.frenzy #tab-fight::before{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 22px rgba(255,90,0,.75);animation:glow .45s alternate infinite;z-index:3}
@keyframes glow{to{box-shadow:inset 0 0 40px 10px rgba(255,200,0,.6)}}
/* Złoty skarb */
#golden{position:absolute;z-index:6;font-size:56px;animation:flyX 6s linear forwards;filter:drop-shadow(0 0 14px gold)}
#golden span{display:inline-block;animation:wob .8s ease-in-out infinite alternate}
@keyframes flyX{from{left:-70px}to{left:105%}}
@keyframes wob{from{transform:translateY(-14px) rotate(-10deg)}to{transform:translateY(14px) rotate(10deg)}}
/* Umiejętności */
#skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
.skill{position:relative;height:66px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#3a2f6e,#251d4b);color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.skill .se{font-size:25px;line-height:1}
.skill .sl{font-size:10px;font-weight:700;margin-top:3px}
.skill .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65)}
.skill .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;text-shadow:0 1px 3px #000}
.skill.act{border-color:#facc15;box-shadow:0 0 12px #facc15}
.skill.ad{background:linear-gradient(180deg,#0e7490,#164e63)}
.skill .ac{position:absolute;top:2px;right:5px;font-size:10px;font-weight:800}
#nextUp{cursor:pointer}

/* =========================================================
   STYLE – panele, karty, przyciski
   ========================================================= */
h2{font-size:21px;margin:2px 0 10px}
h3{font-size:16px;margin:12px 0 8px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06)}
.row{display:flex;align-items:center;gap:10px}
.ico{font-size:34px;width:46px;text-align:center;flex-shrink:0}
.grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.lv{font-size:12px;background:rgba(255,255,255,.1);border-radius:6px;padding:1px 6px;margin-left:4px}
.stars{color:#facc15;letter-spacing:1px}
.btn{min-height:46px;border:none;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;color:#1a1300;background:linear-gradient(180deg,#ffd84d,#f5a623);box-shadow:0 3px 0 #a86b00;min-width:88px;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a86b00}
.btn.off,.btn:disabled{filter:grayscale(1) brightness(.6)}
.btn.blue{background:linear-gradient(180deg,#7dd3fc,#3b82f6);box-shadow:0 3px 0 #1e40af;color:#05153a}
.btn.purple{background:linear-gradient(180deg,#d8b4fe,#9333ea);box-shadow:0 3px 0 #581c87;color:#fff}
.btn.green{background:linear-gradient(180deg,#86efac,#16a34a);box-shadow:0 3px 0 #14532d;color:#04210f}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:0 3px 0 #15102c}
.btn.red{background:linear-gradient(180deg,#fca5a5,#dc2626);box-shadow:0 3px 0 #7f1d1d;color:#fff}
.btn.wide{width:100%;margin-top:8px}
.btn.small{min-height:34px;min-width:0;padding:6px 10px;font-size:13px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:9px 12px;border-radius:999px;background:var(--card2);font-weight:700;font-size:13px;border:none;color:#fff;position:relative}
.chip.on{background:var(--acc);color:#1a1300}
.chip .dot{top:-3px;right:-3px}
.pbar{height:10px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden;margin-top:6px}
.pbar>div{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.cell{background:var(--card2);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;padding:2px;text-align:center;position:relative}
.cell small{font-size:8px;color:var(--mut);line-height:1.1;margin-top:2px}
.cell.lock{opacity:.35}
.cell.today{outline:3px solid var(--acc)}
.cell.done{background:#1e4d33}
.cell .cl{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800;color:#facc15}
.tbl{width:100%;font-size:13px;border-collapse:collapse;margin-top:6px}
.tbl td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.tbl td:last-child{text-align:right;font-weight:700}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.stat div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 8px}
.done-t{color:var(--good);font-weight:800}
.branch{border-left:3px solid var(--acc);padding-left:10px;margin-bottom:12px}
.branch.idle{border-color:#60a5fa}

/* Modal i powiadomienia */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.mbox{background:linear-gradient(180deg,#2c2356,#1a1438);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:86vh;overflow:auto;text-align:center;border:2px solid rgba(255,255,255,.12);animation:pop .25s}
.mbox p{margin:8px 0;color:#e5e0ff}
.big{font-size:30px;font-weight:900;color:var(--acc);margin:8px 0}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 54px);left:50%;transform:translateX(-50%);z-index:120;width:min(92vw,420px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(20,16,40,.96);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;animation:tin .3s,tout .4s 2.6s forwards;text-align:center}
.toast.gold{border-color:var(--acc);background:linear-gradient(90deg,#3a2a05,#1f1a3a)}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#updBanner{position:fixed;top:0;left:0;right:0;z-index:130;background:linear-gradient(90deg,#16a34a,#0d9488);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
#updBanner span{flex:1}
/* Skrzynka */
.chestBig{font-size:110px;display:inline-block;margin:10px 0}
.shake{animation:cshake .9s ease-in-out}
@keyframes cshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg) scale(1.05)}30%{transform:rotate(12deg)}45%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(14deg)}75%{transform:rotate(-8deg) scale(1.2)}}
.rays{position:relative;display:inline-block;margin:10px 0;font-size:90px;animation:pop .4s}
.rays::before{content:'';position:absolute;inset:-40px;background:repeating-conic-gradient(rgba(255,215,0,.35) 0 12deg,transparent 12deg 30deg);border-radius:50%;animation:spin 6s linear infinite;z-index:-1;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.adbox{font-size:80px;margin:16px 0;animation:bob 1s infinite}
/* Koło fortuny */
#wheelWrap{position:relative;width:min(78vw,290px);aspect-ratio:1;margin:18px auto 10px}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid #ffd84d;transition:transform 4s cubic-bezier(.17,.67,.21,1);position:relative;box-shadow:0 0 25px rgba(255,216,77,.4)}
.wseg{position:absolute;left:50%;top:0;height:50%;width:60px;margin-left:-30px;transform-origin:50% 100%;text-align:center;padding-top:12px;font-size:17px;font-weight:900;text-shadow:0 1px 2px #000}
#wheelPtr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2;filter:drop-shadow(0 2px 2px #000)}
#wheelHub{position:absolute;inset:40%;background:#1a1438;border:4px solid #ffd84d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}

/* Bohater i przedmioty */
#hero{position:absolute;left:0;bottom:3%;width:38%;max-width:160px;aspect-ratio:130/160;pointer-events:none;z-index:2}
#hero .herosvg{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2px)}}
.herosvg{width:100%;height:100%;overflow:visible;display:block}
.flm{transform-box:fill-box;transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1);opacity:.95}to{transform:scale(.75,1.3);opacity:.6}}
.spk{transform-box:fill-box;transform-origin:center;animation:twk 1.3s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(.1);opacity:0}50%{transform:scale(1);opacity:1}}
.bolt{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:0}60%,75%{opacity:1}80%,100%{opacity:0}}
.aura{transform-box:fill-box;transform-origin:center;animation:auraP 1.4s ease-in-out infinite alternate}
@keyframes auraP{to{transform:scale(1.1);opacity:.6}}
.slash{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border-top:6px solid var(--sc,#fff);pointer-events:none;animation:slash .25s ease-out forwards;z-index:3;filter:drop-shadow(0 0 6px var(--sc,#fff))}
.slash.crit{width:150px;height:150px;margin:-75px 0 0 -75px;border-top-width:9px}
@keyframes slash{from{transform:rotate(-60deg) scale(.6);opacity:1}to{transform:rotate(80deg) scale(1.1);opacity:0}}
.heroPrev{height:210px;display:flex;justify-content:center;margin:4px 0 8px}
.heroPrev .herosvg{width:auto;height:100%}
.iico{width:100%;height:100%;display:block}
.icell{border:2px solid var(--rc);background:radial-gradient(circle,color-mix(in srgb,var(--rc) 28%,transparent),var(--card2) 72%)}
.icell .cl{color:#fff;text-shadow:0 1px 2px #000}
.icell .eqm{position:absolute;bottom:2px;left:4px;font-size:10px;font-weight:900;color:var(--good)}
.slotIco{width:54px;height:54px;border-radius:12px;flex-shrink:0;padding:3px}
.bigIco{width:110px;height:130px;margin:6px auto}
.rname{font-weight:900;font-size:18px}
.upres{font-weight:900;font-size:18px;margin:6px 0}
.upres.ok{color:#4ade80;animation:pop .3s}
.upres.bad{color:#f87171;animation:cshake .5s}
#nav button{font-size:10px}
.wing{transform-box:fill-box;transform-origin:100% 100%;animation:flap 1.6s ease-in-out infinite alternate}
@keyframes flap{to{transform:rotate(-7deg)}}
.tgt{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:4;text-align:center;line-height:1}
.tgt.crys{font-size:34px;filter:drop-shadow(0 0 8px #60a5fa);animation:bob 1.4s ease-in-out infinite}
.tgt.minion{font-size:40px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.tgt .mhp{width:44px;height:5px;background:rgba(0,0,0,.6);border-radius:3px;margin:3px auto 0;overflow:hidden}
.tgt .mhp i{display:block;height:100%;background:#ef4444}
.tgt .pips{font-size:10px;font-weight:900;color:#bfdbfe;text-shadow:0 1px 2px #000}
.weak{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:4px solid #fde047;box-shadow:0 0 14px #fde047,inset 0 0 12px #fde047;pointer-events:none;z-index:4;animation:weakP .5s ease-in-out infinite alternate}
.weak::after{content:'';position:absolute;inset:16px;border-radius:50%;background:#fde047}
@keyframes weakP{to{transform:scale(1.18)}}
#monster.spiky #monsterEmoji{filter:drop-shadow(0 0 14px #ef4444) drop-shadow(0 0 4px #ef4444) saturate(1.6)!important}
#monster.warn #monsterEmoji{animation:warnB .2s steps(2) infinite}
@keyframes warnB{50%{filter:brightness(1.8) drop-shadow(0 0 10px #facc15)}}
#mechBar{text-align:center;font-size:13px;font-weight:800;border-radius:10px;padding:4px 8px;background:rgba(0,0,0,.45)}
#mechBar.danger{background:rgba(220,38,38,.75);animation:warnB .4s steps(2) infinite}
.cauldron{font-size:80px;display:inline-block;margin:6px 0}
.fuseRow{display:flex;justify-content:center;gap:8px;margin:8px 0}
.fuseRow .cell{width:64px;height:64px}
.fly{animation:flyIn .9s ease-in forwards}
@keyframes flyIn{to{transform:translateY(70px) scale(.2);opacity:0}}
.bld{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{background:linear-gradient(160deg,#3b2f1a,#211a10);border:1px solid rgba(255,200,120,.25);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.bcard .be{font-size:42px}
.bcard .btn{width:100%;margin-top:auto}
.tier{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.tier .tn{font-weight:900;font-size:18px;text-align:center;background:var(--card2);border-radius:10px;padding:8px 0}
.tier .tn.got{background:#16a34a}
.rw{background:var(--card);border-radius:12px;padding:8px;text-align:center;font-size:12px;min-height:70px;display:flex;flex-direction:column;justify-content:center;gap:4px;border:1px solid transparent}
.rw.prem{background:linear-gradient(160deg,#4a3500,#2a1f00);border-color:#f5c542}
.rw .re{font-size:22px}
.rw.done{opacity:.45}
.clsc{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px;border:2px solid transparent}
.clsc.on{border-color:var(--acc)}
.clsc .ce{font-size:40px}
.myth{border:2px solid #ffd700!important;box-shadow:0 0 10px #ffd700,inset 0 0 8px rgba(255,215,0,.45);animation:mythG 1.6s ease-in-out infinite alternate;background:radial-gradient(circle,#5a3a00,#1a1000 75%)!important}
@keyframes mythG{to{box-shadow:0 0 18px #ffb800,inset 0 0 12px rgba(255,215,0,.7)}}
.uimg{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
.one{position:absolute;top:-6px;left:-6px;background:linear-gradient(180deg,#fff3b0,#f5c542);color:#3a2400;font-size:9px;font-weight:900;border-radius:6px;padding:1px 4px;box-shadow:0 1px 3px #000;z-index:2}
.bigIco.uni{width:120px;height:120px;border-radius:14px;padding:4px;position:relative}
.sunray{position:absolute;width:70px;margin-left:-35px;top:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,0),#fff6c2 40%,#ffb020);border-radius:0 0 35px 35px;filter:blur(1px) drop-shadow(0 0 18px #ffb020);animation:sunray .45s ease-out forwards}
@keyframes sunray{from{opacity:0;transform:scaleX(.2)}20%{opacity:1;transform:scaleX(1)}to{opacity:0;transform:scaleX(1.6)}}
#app.sunflash::after{content:'';position:absolute;inset:0;background:rgba(255,220,120,.35);pointer-events:none;animation:fadeO .35s forwards;z-index:50}
@keyframes fadeO{to{opacity:0}}
.lore{font-style:italic;color:#fde68a;font-size:13px;margin:6px 0}
.power{background:rgba(255,180,0,.12);border:1px solid rgba(255,200,0,.4);border-radius:12px;padding:8px;text-align:left;font-size:13px;margin:8px 0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tgrid .btn{min-width:0;font-size:13px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.shopc{position:relative;background:linear-gradient(160deg,#2f2766,#1f1945);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.shopc .se{font-size:40px;line-height:1.1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.shopc b{font-size:15px}
.shopc .sub{min-height:30px}
.shopc .btn{width:100%;margin-top:auto}
.shopc.perm{grid-column:span 2;flex-direction:row;text-align:left;gap:12px;background:linear-gradient(135deg,#4c1d95,#1e1b4b);border-color:#a78bfa}
.shopc.perm .grow{display:flex;flex-direction:column;gap:2px}
.shopc.perm .btn{width:auto;margin:0}
.shopc .tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:900;background:#facc15;color:#1a1300;border-radius:6px;padding:2px 6px}
.owned{color:var(--good);font-weight:900}
.bchip.btnchip{border:1px solid #22d3ee;cursor:pointer}
.dmg.auto{font-size:16px;color:#a5f3fc}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:none;border-radius:20px;padding:16px 14px;min-height:132px;color:#fff;text-align:left;background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:flex-end;gap:3px;overflow:hidden;font-family:inherit}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile::before{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile .ti{font-size:40px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.tile b{font-size:17px;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tile small{font-size:12.5px;font-weight:700;opacity:.92;line-height:1.25}
.tile .dot{top:12px;right:12px;width:14px;height:14px}
.tile.wide{grid-column:span 2;min-height:96px;flex-direction:row;align-items:center;gap:14px}
.tile.wide .ti{margin:0}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbar button{border:none;border-radius:14px;background:var(--card2);color:#fff;font-size:22px;font-weight:900;width:48px;height:48px;flex-shrink:0}
.backbar h2{margin:0;font-size:22px}
.legset{background:linear-gradient(90deg,rgba(245,197,66,.25),rgba(56,189,248,.2));border:1px solid #f5c542}

/* Skórki wydarzeń */
#app.skin-pumpkin{--acc:#ff8c1a}
#app.skin-pumpkin #arena::before{content:'';position:absolute;inset:5%;background:radial-gradient(circle,rgba(255,120,0,.4),transparent 65%);pointer-events:none}
#app.skin-pumpkin #top{background:linear-gradient(90deg,rgba(120,40,0,.6),rgba(40,0,60,.6))}
#app.skin-winter #arena::before{content:'';position:absolute;inset:0;background:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 60% 30%,#fff,transparent),radial-gradient(2px 2px at 80% 60%,#fff,transparent),radial-gradient(2px 2px at 50% 90%,#fff,transparent),radial-gradient(circle,rgba(180,220,255,.3),transparent 65%);pointer-events:none}

  const total = list.reduce((s, x) => s + x[1], 0);
  let r = Math.random() * total;
  for (const x of list) { if ((r -= x[1]) < 0) return x[0]; }
  return list[list.length - 1][0];
}

/* Skracanie liczb: K, M, B, T, aa, ab ... */
function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '0';
  if (!isFinite(n)) return '∞';
  if (n < 0) n = 0;
  if (n < 1000) return (n < 10 && n % 1 > 0.05) ? n.toFixed(1) : String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  const v = n / Math.pow(10, e * 3);
  let suf;
  if (e <= 4) suf = ['', 'K', 'M', 'B', 'T'][e];
  else { const i = e - 5; suf = String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26); }
  const s = v < 10 ? (Math.floor(v * 100) / 100).toFixed(2) : v < 100 ? (Math.floor(v * 10) / 10).toFixed(1) : String(Math.floor(v));
  return s + suf;
}
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;

function deepMerge(base, src) {
  if (!src || typeof src !== 'object') return base;
  for (const k in src) {
    const v = src[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = deepMerge(base[k], v);
    else if (v !== undefined) base[k] = v;
  }
  return base;
}
function save() {

  try { S.lastSeen = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { console.warn('Zapis nieudany', e); }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    S = deepMerge(defaultState(), JSON.parse(raw));
    ['helpers', 'cards', 'stars'].forEach(k => { while (S[k].length < HELPERS.length) S[k].push(0); });
    return true;
  } catch (e) { console.warn('Odczyt nieudany', e); S = defaultState(); return false; }
}

// Sumuje wszystkie źródła trwałych bonusów
function bonusAcc() {
  const a = { dmg: 0, click: 0, dps: 0, coin: 0, critC: 0, critM: 0, offline: 0, offlineH: 0, gold: 0, frenzyT: 0, combo: 0, bossT: 0, cdr: 0, meteor: 0 };
  const add = (t, v) => { a[t] = (a[t] || 0) + v; };
  for (const x of ACHIEVEMENTS) if (S.achievements[x.id]) add(x.b[0], x.b[1]);
  for (const t of TALENTS) { const l = S.talents[t.id] || 0; if (l) t.fx.forEach(f => add(f[0], f[1] * l)); }
  for (const ar of ARTIFACTS) { const l = S.artifacts[ar.id] || 0; if (l) add(ar.t, ar.v * l); }
  for (const sl of SLOT_ORDER) { const it = equippedItem(sl); if (it) add(SLOTS[sl].t, itemValue(it)); }
  if (legendarySet(equippedAll())) { add('dmg', .50); add('coin', .25); }
  for (let w = 0; w < WORLDS.length; w++) if (worldComplete(w)) { add('dmg', .10); add('coin', .10); }
  if (Object.keys(S.artifacts).length >= ARTIFACTS.length) add('dmg', .25);
  if (S.skins.pumpkin) add('coin', .05);
  if (S.skins.winter) add('dmg', .05);
  if (S.shop.vip) add('coin', .50);
  if (S.shop.bed) add('offlineH', 4);
  const vb = S.village.b;
  add('dps', vb.tavern * .10); add('frenzyT', vb.tower * .5); add('cdr', vb.tower * .03); add('coin', vb.vault * .08);
  if (S.cls && CLASSES[S.cls]) CLASSES[S.cls].fx(Math.min(10, S.stats.prestiges)).forEach(f => add(f[0], f[1]));
  return a;
}
const prestigeMult = () => 1 + S.crystalsTotal * 0.10;   // każdy zdobyty kryształ +10% obrażeń
function globalBoost() { const n = Date.now(); return (S.boosts.ad > n ? 2 : 1) * (S.boosts.chest > n ? 3 : 1) * ((S.boosts.shopDmg || 0) > n ? 2 : 1); }
function clickDamage() {
  const b = R.B;
  return (1 + S.clickLvl) * Math.pow(2, Math.floor(S.clickLvl / 15)) * (1 + b.click) * (1 + b.dmg) * prestigeMult() * globalBoost();
}
function helperDps(i) {
  const l = S.helpers[i]; if (!l) return 0;
  return HELPERS[i].dps * l * Math.pow(2, Math.floor(l / 15)) * (1 + S.stars[i] * 0.75);
}
function dpsBase() {
  let s = 0; for (let i = 0; i < HELPERS.length; i++) s += helperDps(i);
  return s * (1 + R.B.dps) * (1 + R.B.dmg) * prestigeMult();

function incomePerSec() {
  const rate = Math.max(totalDps(), clickDamage() * 4);
  const kps = Math.min(3, rate / (10 * Math.pow(1.15, S.level)));
  return kps * baseCoin(S.level) * coinMult();
}
function offlineRate() {

// Koszt zakupu n poziomów (ciąg geometryczny); mode: 1, 10 lub 'max'
function bulk(base, r, lvl, mode) {
  const c0 = base * Math.pow(r, lvl);
  let n = mode === 'max' ? Math.max(1, Math.floor(Math.log(S.coins * (r - 1) / c0 + 1) / Math.log(r))) : mode;
  return { n, cost: c0 * (Math.pow(r, n) - 1) / (r - 1) };
}

function cheapestUpgrade() {
  const c = [10 * Math.pow(CLICK_R, S.clickLvl)];
  HELPERS.forEach((h, i) => { if (i === 0 || S.helpers[i - 1] > 0 || S.helpers[i] > 0) c.push(h.cost * Math.pow(HELPER_R, S.helpers[i])); });
  if (S.critChanceLvl < CRIT_C_MAX) c.push(critCCost());
  if (S.critMultLvl < CRIT_M_MAX) c.push(critMCost());
  return Math.min(...c);
}
function prestigeGain() { return S.maxLevelRun < 50 ? 0 : Math.floor(Math.pow(S.maxLevelRun / 50, 2.2) * 3); }
function dprog(type, n = 1) { S.daily.prog[type] = (S.daily.prog[type] || 0) + n; }

function spawnMonster() {
  const l = S.level, boss = isBossLevel(l), wi = worldIndex(l), w = WORLDS[wi], look = lookIndex(l);
  let [em, name] = w.mons[look % 10], elite = look >= 10, ev = false;
  const E = currentEvent();
  if (E && !boss && Math.random() < 0.25) { [em, name] = pick(E.mons); ev = true; elite = false; }
  if (!ev) S.seen[wi + '-' + look] = true;
  R.cur = { boss, em, ev, elite, name: (elite ? 'Elitarny ' : '') + name, max: monsterMaxHp(l) };
  S.hp = R.cur.max;
  clearTargets();
  monsterEl.classList.remove('spiky', 'warn');
  R.mech = boss ? { type: bossMech(l), start: Date.now(), spawned: false } : null;
  R.weakNext = Date.now() + 2500;
  if (boss) S.bossLeft = 30 + R.B.bossT + (R.mech.type ? 10 : 0);
  if (boss && R.mech.type) setTimeout(() => setupMech(), 380);
  monsterEmoji.textContent = em;
  monsterEmoji.style.filter = elite ? 'hue-rotate(150deg) saturate(1.6)' : '';
  monsterEl.classList.toggle('boss', boss);
  restartAnim(monsterEl, 'spawn');
  const app = $('app');
  WORLDS.forEach(x => app.classList.remove(x.cls));
  app.classList.add(w.cls);
  $('deco').textContent = w.deco;
  setText($('monsterName'), (boss ? '👑 BOSS: ' : '') + R.cur.name + (ev ? ' ' + E.e : '') + (boss && R.mech.type ? ' · ' + BOSS_MECH[R.mech.type].n : ''));
  setText($('worldName'), w.icon + ' ' + w.name + (worldCycle(l) ? ' +' + worldCycle(l) : ''));
}

function onTap(e) {
  e.preventDefault();
  if (R.dying || !R.cur) return;
  const now = Date.now();
  S.stats.clicks++; dprog('clicks');
  // Combo – napełnia się przy szybkim klikaniu
  if (S.boosts.frenzy <= now) {
    S.combo = Math.min(100, S.combo + 3.2 * (1 + R.B.combo));
    if (S.combo >= 100) startFrenzy();
  }
  R.lastTap = performance.now();
  // Mechaniki bossa: kolce, kryształy, sługi, słabe punkty
  const ar = arena.getBoundingClientRect(), tx = e.clientX - ar.left, ty = e.clientY - ar.top;
  if (spikesOn()) { spikePenalty(tx, ty); return; }
  const tg = targetAt(tx, ty);
  if (tg && tg.type !== 'weak') { hitTarget(tg, tx, ty); return; }
  const weakHit = !!tg;
  if (weakHit) removeTarget(tg);
  let d = clickDamage();
  const crit = weakHit || Math.random() < critChance();
  if (crit) { d *= critMult(); S.stats.crits++; dprog('crits'); }
  if (S.boosts.frenzy > now) d *= 5;
  if (R.god) d *= 1000;
  if (weakHit) { d *= 3; S.stats.weak++; const p = monsterCenter(); popText(Math.min(Math.max(p.x, 90), arena.clientWidth - 90), p.y - 70, '🎯 SŁABY PUNKT!', 'crit'); vibrate([20, 20, 40]); sfxWeak(); }
  sunCharge(now);
  const r = arena.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  popText(x, y - 10, (crit ? '💥' : '') + fmt(d), crit ? 'crit' : '');
  particles(x, y, crit ? 10 : 5);
  shake();
  heroSwing(crit);
  slashFx(crit);
  sfxHit(crit);
  vibrate(crit ? 25 : 10);
  dealDamage(d);
}
const sunWeapon = () => { const w = equippedItem('weapon'); return w && w.u === 'sunblade' ? w : null; };
function sunCharge(now) {
  const w = sunWeapon(); if (!w) return;
  if (w.l >= 9 && S.boosts.frenzy > now) { sunRay(w); return; }
  R.sun = (R.sun || 0) + 1;
  if (R.sun >= (w.l >= 6 ? 20 : 25)) { R.sun = 0; sunRay(w); }
}
function sunRay(w) {
  const p = monsterCenter();
  const d = clickDamage() * 10 * (S.boosts.frenzy > Date.now() ? 5 : 1) * (R.god ? 1000 : 1);
  const ray = document.createElement('div');
  ray.className = 'sunray'; ray.style.left = p.x + 'px'; ray.style.height = (p.y + 30) + 'px';
  fx.appendChild(ray); setTimeout(() => ray.remove(), 500);
  const app = $('app'); app.classList.remove('sunflash'); void app.offsetWidth; app.classList.add('sunflash');
  popText(p.x, p.y - 60, '☀️' + fmt(d), 'big');
  particles(p.x, p.y, 16, true);
  if (w.l >= 3) {
    const max = w.l >= 6 ? 3 : 1, now = Date.now();
    const st = R.burn && R.burn.until > now ? Math.min(max, R.burn.st + 1) : 1;
    R.burn = { until: now + 3000, st, dps: clickDamage() * 2 };
  }
  vibrate([20, 20, 60]);
  dealDamage(d);
}
function dealDamage(d) {
  if (R.dying) return;
  R.lastHitMs = Date.now();
  const mins = R.targets.filter(t => t.type === 'minion');
  if (mins.length) { hitMinion(mins[0], d); return; }
  d *= bossDmgFactor();
  S.hp -= d;
  if (S.hp <= 0) { S.hp = 0; kill(); }
}
function startFrenzy() {
  S.boosts.frenzy = Date.now() + (10 + R.B.frenzyT) * 1000;
  S.combo = 0; S.stats.frenzies++; dprog('frenzy');
  toast('🔥 SZAŁ! ×5 obrażeń!', 'gold');
  vibrate([50, 30, 50]);
}
function kill() {
  if (R.dying) return;
  R.dying = true;
  clearTargets();
  const c = R.cur, l = S.level;
  const coins = baseCoin(l) * (c.boss ? 5 : 1) * coinMult();
  S.coins += coins;
  S.stats.kills++; dprog('kills');
  const E = currentEvent();
  if (c.ev && E) { S.event.cur += 1; }
  const p = monsterCenter();
  if (c.boss) {
    S.stats.bosses++; dprog('boss'); addXP(10);
    if (Math.random() < 0.03) { S.luck++; toast('🍀 Znalazłeś kamień szczęścia!', 'gold'); }
    const rare = Math.random() < 0.15;
    S.chests[rare ? 'rare' : 'common']++;
    const st = 1 + Math.floor(l / 50); S.stones += st;
    toast(`👑 Boss pokonany! ${rare ? '🎁 Rzadka skrzynka' : '📦 Skrzynka'} i +${st} 💠`, 'gold');
    if (Math.random() < 0.35) giveItem(rollItem([55, 27, 12, 5, 1]));
    if (l >= 100 && !S.uniques.sunblade && Math.random() < 0.005) giveUnique('sunblade');
  }
  fragments(c.em);
  particles(p.x, p.y, 18, true);
  popText(p.x, p.y - 40, '+' + fmt(coins) + ' 🪙' + (c.ev && E ? ' +1' + E.cur : ''), 'coin');
  coinBurst(p.cx, p.cy, c.boss ? 12 : 6);
  setTimeout(sfxCoin, 700);
  restartAnim(monsterEl, 'dying');
  vibrate(c.boss ? [60, 40, 60] : 35);
  S.level++;
  S.maxLevelRun = Math.max(S.maxLevelRun, S.level);
  if (S.level > S.maxLevelEver) {
    if (worldIndex(S.level) !== worldIndex(S.maxLevelEver) && (S.level - 1) % 100 === 0) toast(`🌍 Nowy świat: ${WORLDS[worldIndex(S.level)].icon} ${WORLDS[worldIndex(S.level)].name}!`, 'gold');
    S.maxLevelEver = S.level;
  }
  setTimeout(() => { R.dying = false; spawnMonster(); }, 400);
}
function bossFail() {
  R.dying = true;
  clearTargets();
  toast('⏱️ Boss uciekł! Wracasz poziom niżej.');
  vibrate(200);
  S.level = Math.max(1, S.level - 1);

  setTimeout(() => { R.dying = false; spawnMonster(); }, 400);
}

      const m = document.createElement('div');
      m.className = 'meteor'; m.textContent = '☄️';
      m.style.left = (r.x - 22 + rand(-40, 40)) + 'px'; m.style.top = (r.y - 22 + rand(-30, 30)) + 'px';
      m.style.animationDelay = (i * 60) + 'ms';
      fx.appendChild(m); setTimeout(() => m.remove(), 800);
    }
    setTimeout(() => {
      popText(r.x, r.y - 30, '☄️' + fmt(d), 'big');

  vibrate(30);
}

const itemById = id => S.items.find(i => i.id === id);
const equippedItem = slot => S.equip[slot] ? itemById(S.equip[slot]) || null : null;
function equippedAll() { const o = {}; SLOT_ORDER.forEach(s => o[s] = equippedItem(s)); return o; }
const itemValue = it => SLOTS[it.slot].base * RARITY[it.r].m * (1 + 0.15 * it.l);
const itemName = it => it.n || (BASES[it.slot].find(b => b[0] === it.b) || ['', SLOTS[it.slot].n])[1];

function newItem(slot, r, b, name) {

function rollItem(weights) { return newItem(pick(SLOT_ORDER), weighted(weights.map((w, i) => [i, w]))); }
function giveItem(it, quiet) {

/* =========================================================

const merchantActive = () => S.merchant.until > Date.now();
function merchantTick() {
  const m = S.merchant, now = Date.now();

  if (!merchantActive() && now >= m.next) {
    m.until = now + 10 * 60000; m.next = m.until + rand(2, 4) * 3600e3;
    const pool = MERCHANT_POOL.slice(), offers = [];
    while (offers.length < 3) { const o = weighted(pool.map(x => [x, x.w])); pool.splice(pool.indexOf(o), 1); offers.push(o); }
    m.offers = offers.map(o => ({ id: o.id, price: o.coins ? Math.max(1000, incomePerSec() * 1800) : o.p, coins: !!o.coins, sold: false }));

}

    m.offers.map((o, i) => { const d = MERCHANT_POOL.find(x => x.id === o.id);
      return `<div class="shopc">${o.sold ? '<span class="tag">KUPIONE</span>' : ''}<div class="se">${d.e}</div><b>${d.n}</b><span class="sub">${d.d}</span>
        ${o.sold ? '<span class="owned">✓</span>' : `<button class="btn small ${o.coins ? '' : 'blue'}" data-act="mBuy" data-arg="${i}">${o.coins ? '🪙 ' + fmt(o.price) : o.price + ' 💎'}</button>`}</div>`; }).join('') + `</div>`;
}
function merchantBuy(i) {
  const o = S.merchant.offers[i]; if (!o || o.sold || !merchantActive()) return;
  if (o.coins ? S.coins < o.price : S.gems < o.price) { toast(o.coins ? 'Za mało monet 🪙' : 'Za mało klejnotów 💎'); return; }
  if (o.coins) S.coins -= o.price; else S.gems -= o.price;

/* =========================================================
   8i. PRZEPUSTKA SEZONOWA (co miesiąc)

const seasonKeyNow = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1); };
function seasonCheck() { if (S.season.key !== seasonKeyNow()) S.season = { key: seasonKeyNow(), xp: 0, prem: false, cf: {}, cp: {} }; }
const seasonTier = () => Math.min(SEASON_TIERS, Math.floor(S.season.xp / SEASON_XP));
function addXP(n) { seasonCheck(); const before = seasonTier(); S.season.xp += n; if (seasonTier() > before) toast(`📅 Przepustka: poziom ${seasonTier()}!`, 'gold'); }
function seasonReward(t, prem) {
  if (!prem) {
    if (t % 5 === 0) return { e: '🎁', d: 'Rzadka skrzynka', g: () => S.chests.rare++ };
    return [{ e: '🪙', d: 'Monety (30 min)', g: () => S.coins += Math.max(1000, incomePerSec() * 1800) }, { e: '💠', d: '10 kamieni', g: () => S.stones += 10 }, { e: '📦', d: 'Skrzynka', g: () => S.chests.common++ }, { e: '💎', d: '10 klejnotów', g: () => S.gems += 10 }][t % 4];
  }
  if (t === SEASON_TIERS) return { e: '🌟', d: 'Peleryna sezonu + 3 🍀', g: () => { S.capes.season = true; S.capeOn = true; S.luck += 3; renderHero(); } };
  if (t % 10 === 0) return { e: '🟠', d: 'Legendarny przedmiot', g: () => giveItem(newItem(pick(SLOT_ORDER), 4)) };
  if (t % 5 === 0) return { e: '🍀', d: 'Kamień szczęścia + 25 💎', g: () => { S.luck++; S.gems += 25; } };
  return [{ e: '💎', d: '25 klejnotów', g: () => S.gems += 25 }, { e: '💠', d: '30 kamieni', g: () => S.stones += 30 }, { e: '🎁', d: 'Rzadka skrzynka', g: () => S.chests.rare++ }, { e: '📦', d: '2 skrzynki', g: () => S.chests.common += 2 }][t % 4];
}
function seasonClaimable() {
  const T = seasonTier();
  for (let t = 1; t <= T; t++) { if (!S.season.cf[t]) return true; if (S.season.prem && !S.season.cp[t]) return true; }
  return false;
}
function seasonClaim(a) {
  const [kind, ts] = a.split('|'), t = +ts, prem = kind === 'p';
  if (t > seasonTier()) return;
  if (prem && !S.season.prem) { toast('Odblokuj Złotą przepustkę 👑'); return; }
  const map = prem ? S.season.cp : S.season.cf; if (map[t]) return;
  map[t] = true; const r = seasonReward(t, prem); r.g();
  toast(`📅 ${r.e} ${r.d}`, 'gold'); sfxCoin(); renderPanel();
}
function seasonBuyPrem() {
  if (S.season.prem) return;
  if (S.gems < SEASON_PRICE) { toast(`Złota przepustka kosztuje ${SEASON_PRICE} 💎`); return; }
  S.gems -= SEASON_PRICE; S.season.prem = true; toast('👑 Złota przepustka odblokowana!', 'gold'); sfxWin(); renderPanel();
}
function htmlSeason() {
  seasonCheck();
  const T = seasonTier(), xpIn = S.season.xp - T * SEASON_XP, now = new Date(), end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  let h = `<div class="card"><div class="row"><div class="grow"><b>Sezon ${now.toLocaleString('pl-PL', { month: 'long' })}</b><div class="sub">Koniec za ${Math.ceil((end - now) / 864e5)} dni – nieodebrane nagrody przepadają</div></div><div class="big" style="font-size:22px;margin:0">${T}/${SEASON_TIERS}</div></div>
    ${T < SEASON_TIERS ? `<div class="pbar"><div style="width:${xpIn / SEASON_XP * 100}%"></div></div><div class="sub">${xpIn}/${SEASON_XP} XP do następnego poziomu</div>` : '<p class="done-t">Przepustka ukończona! 🎉</p>'}
    <p class="sub" style="margin-top:6px">XP: zadanie +40 · logowanie +30 · boss +10 · złoty skarb +10 · fuzja +15 · skrzynka +5</p></div>
    ${S.season.prem ? '<div class="card legset" style="text-align:center"><b>👑 Złota przepustka aktywna</b></div>' : `<button class="btn wide" data-act="sPrem" style="margin-bottom:10px">👑 Odblokuj Złotą przepustkę – ${SEASON_PRICE} 💎<br><span style="font-size:11px">Lepsze nagrody, legendarne przedmioty i Peleryna sezonu</span></button>`}
    <div class="tier"><span></span><b style="text-align:center">Darmowa</b><b style="text-align:center;color:#f5c542">Złota 👑</b></div>`;
  for (let t = 1; t <= SEASON_TIERS; t++) {
    const f = seasonReward(t, false), pr = seasonReward(t, true), got = t <= T;
    const cell = (r, prem, done) => `<div class="rw ${prem ? 'prem' : ''} ${done ? 'done' : ''}"><span class="re">${r.e}</span><span>${r.d}</span>${done ? '<b class="done-t">✓</b>' : got && (!prem || S.season.prem) ? `<button class="btn small ${prem ? '' : 'green'}" data-act="sClaim" data-arg="${prem ? 'p' : 'f'}|${t}">Odbierz</button>` : prem && !S.season.prem ? '🔒' : ''}</div>`;
    h += `<div class="tier"><div class="tn ${got ? 'got' : ''}">${t}</div>${cell(f, false, S.season.cf[t])}${cell(pr, true, S.season.cp[t])}</div>`;
  }
  return h;
}

/* =========================================================
   9. SKRZYNKI
   ========================================================= */
function rollChest(type) {
  const kind = weighted(CHESTS[type].drops), rare = type === 'rare';
  if (kind === 'item') {
    const it = rollItem(rare ? [0, 35, 38, 20, 7] : [50, 32, 13, 4, 1]);
    const label = giveItem(it, true);
    return { icon: `<span style="display:inline-block;width:90px;height:110px">${itemIcon(it, true)}</span>`, title: label };
  }
  if (kind === 'coins') {
    const amt = Math.max(incomePerSec() * 120, baseCoin(S.level) * 10 * coinMult()) * (rare ? 4 : 1);
    S.coins += amt; return { icon: '🪙', title: fmt(amt) + ' monet' };
  }
  if (kind === 'boost') {
    S.boosts.chest = Math.max(Date.now(), S.boosts.chest) + 60000;
    return { icon: '⚡', title: 'Boost ×3 obrażeń na 60 s' };
  }
  if (kind === 'card') {
    const i = randInt(0, HELPERS.length - 1), n = rare ? randInt(3, 5) : randInt(1, 2);
    S.cards[i] += n; return { icon: HELPERS[i].e, title: `${n}× karta: ${HELPERS[i].name}` };
  }
  const a = pick(ARTIFACTS), l = S.artifacts[a.id] || 0;
  if (l >= 5) { S.gems += 25; return { icon: '💎', title: `${a.name} ma maks. poziom → 25 💎` }; }
  S.artifacts[a.id] = l + 1;
  return { icon: a.e, title: l ? `${a.name} → poziom ${l + 1}` : `Nowy artefakt: ${a.name}!` };
}
function openChest(type) {
  if (S.chests[type] <= 0) return;
  S.chests[type]--; S.stats.chests++; dprog('chests'); addXP(5);
  const res = rollChest(type);
  showModal(`<h2>${CHESTS[type].name}</h2><div id="chestA"><div class="chestBig shake">${CHESTS[type].e}</div><p>Otwieranie…</p></div>
    <div id="chestB" class="hidden"><div class="rays">${res.icon}</div><div class="big" style="font-size:20px">${res.title}</div>
    <button class="btn wide" data-act="closeModal">Super!</button>
    ${S.chests[type] > 0 ? `<button class="btn ghost wide" data-act="openAgain" data-arg="${type}">Otwórz kolejną (${S.chests[type]})</button>` : ''}</div>`);
  vibrate([20, 40, 20, 40, 20]);
  setTimeout(() => { const a = $('chestA'), b = $('chestB'); if (a && b) { a.classList.add('hidden'); b.classList.remove('hidden'); vibrate(60); } }, 950);
  renderPanel();
}
function buyChest(type) {
  const p = CHESTS[type].price;
  if (S.gems < p) { toast('Za mało klejnotów 💎'); return; }
  S.gems -= p; S.chests[type]++; toast(`Kupiono: ${CHESTS[type].name}`); renderPanel();
}

function rollQuests() {
  const pool = QUEST_POOL.slice().sort(() => Math.random() - .5).slice(0, 3);
  return pool.map((q, i) => {
    let n = randInt(q.n[0], q.n[1]);
    if (n >= 100) n = Math.round(n / 50) * 50;
    return { t: q.t, txt: q.txt.replace('{n}', n), n, gems: [15, 20, 30][i], claimed: false };
  });
}
function newDay() {
  const today = todayKey();
  S.daily = { date: today, quests: rollQuests(), prog: {}, adBoosts: 0, freeSpin: true, adSpin: true };
  if (S.login.last !== today) {
    S.login.streak = (S.login.last === yesterdayKey()) ? (S.login.streak % 7) + 1 : 1;   // przerwanie serii = reset
    S.login.last = today; S.login.pending = true;
    showLoginModal();

  save();
}
function loginGrid() {
  return `<div class="grid g4" style="grid-template-columns:repeat(7,1fr);gap:4px">` + LOGIN_REWARDS.map((r, i) => {
    const day = i + 1, cls = day < S.login.streak || (day === S.login.streak && !S.login.pending) ? 'done' : day === S.login.streak ? 'today' : '';

  }).join('') + `</div>`;
}
function showLoginModal() {
  const r = LOGIN_REWARDS[S.login.streak - 1];
  showModal(`<h2>📅 Nagroda za logowanie</h2><p>Seria: <b>${S.login.streak}</b> / 7 dni</p>${loginGrid()}

    <button class="btn wide" data-act="claimLogin">Odbierz</button>`);
}
function claimLogin() {
  if (!S.login.pending) { closeModal(); return; }
  const r = LOGIN_REWARDS[S.login.streak - 1];
  if (r.gems) S.gems += r.gems;
  if (r.chest) S.chests[r.chest] += r.n;
  if (r.coinsMin) S.coins += Math.max(incomePerSec() * 60 * r.coinsMin, baseCoin(S.level) * 20);
  S.login.pending = false; addXP(30);
  toast(`📅 Odebrano: ${r.d}`, 'gold');
  closeModal(); renderPanel();
}
function claimQuest(i) {
  const q = S.daily.quests[+i];
  if (!q || q.claimed || (S.daily.prog[q.t] || 0) < q.n) return;
  q.claimed = true; S.gems += q.gems; S.chests.common++; addXP(40);
  toast(`✅ Zadanie wykonane! +${q.gems} 💎 +📦`, 'gold'); vibrate(30); renderPanel();
}
function spin(mode) {
  if (R.spinning) return;
  if (mode === 'free') { if (!S.daily.freeSpin) return; S.daily.freeSpin = false; doSpin(); }
  else { if (!S.daily.adSpin) return; showAd(() => { S.daily.adSpin = false; setTab('more'); doSpin(); }); }
}
function doSpin() {
  const i = weighted(WHEEL.map((w, k) => [k, w.w]));
  const seg = 360 / WHEEL.length;
  const target = 360 - (i * seg + seg / 2);
  const cur = ((R.wheelRot % 360) + 360) % 360;
  R.wheelRot += 360 * 5 + ((target - cur + 360) % 360);
  R.spinning = true;
  renderPanel();
  requestAnimationFrame(() => { const w = $('wheel'); if (w) w.style.transform = `rotate(${R.wheelRot}deg)`; });
  setTimeout(() => { R.spinning = false; giveWheel(i); renderPanel(); }, 4200);
}
function giveWheel(i) {
  const w = WHEEL[i];
  switch (i) {
    case 0: S.coins += Math.max(incomePerSec() * 120, baseCoin(S.level) * 10); break;
    case 1: S.gems += 5; break;
    case 2: S.boosts.chest = Math.max(Date.now(), S.boosts.chest) + 60000; break;
    case 3: S.chests.common++; break;
    case 4: S.gems += 20; break;
    case 5: S.coins += Math.max(incomePerSec() * 600, baseCoin(S.level) * 40); break;
    case 6: S.chests.rare++; break;
    case 7: S.crystals++; S.crystalsTotal++; break;
  }
  vibrate([30, 30, 80]);
  showModal(`<h2>🎡 Wygrana!</h2><div class="rays">${w.l}</div><div class="big" style="font-size:20px">${w.d}</div><button class="btn wide" data-act="closeModal">Super!</button>`);
}

function talentCost(t) {
  const pos = TALENTS.filter(x => x.br === t.br).indexOf(t);
  return ((S.talents[t.id] || 0) + 1) * (pos + 1);
}
function buyTalent(id) {
  const t = TALENTS.find(x => x.id === id), l = S.talents[id] || 0;
  const br = TALENTS.filter(x => x.br === t.br), pos = br.indexOf(t);
  if (l >= t.max) return;
  if (pos > 0 && !(S.talents[br[pos - 1].id] > 0)) { toast('Najpierw odblokuj poprzedni talent'); return; }
  const c = talentCost(t);
  if (S.crystals < c) { toast('Za mało kryształów 🔮'); return; }
  S.crystals -= c; S.talents[id] = l + 1; vibrate(20); renderPanel();
}
function eventBuy(id) {
  const E = currentEvent(); if (!E) return;
  const items = { skin: E.skinCost, rare: 40, boost: 15, gems: 20, helm: E.helm.cost };
  const c = items[id];
  if (id === 'skin' && S.skins[E.skin]) return;
  if (S.event.cur < c) { toast(`Za mało: ${E.curName} ${E.cur}`); return; }
  S.event.cur -= c;
  if (id === 'skin') { S.skins[E.skin] = true; S.skin = E.skin; applySkin(); toast(`✨ Odblokowano: ${E.skinName}!`, 'gold'); }
  if (id === 'rare') { S.chests.rare++; toast('🎁 Kupiono rzadką skrzynkę'); }
  if (id === 'boost') { S.boosts.chest = Math.max(Date.now(), S.boosts.chest) + 60000; toast('⚡ Boost ×3 na 60 s'); }
  if (id === 'gems') { S.gems += 15; toast('+15 💎'); }
  if (id === 'helm') giveItem(newItem('helmet', 3, E.helm.b, E.helm.name));
  renderPanel();
}

function setTab(t) {

  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.arg === t));
  if (t !== 'fight' && R.golden) { R.golden.remove(); R.golden = null; S.nextGolden = Date.now() + 30000; }
  renderPanel();

function renderPanel() {

function shopInfo(id) {
  if (id === 'auto') { const t = AUTO_TIERS[S.shop.auto]; return t ? { e: '🤖', name: `Autoclicker ${t.rate}/s`, price: t.price } : null; }
  return SHOP.find(x => x.id === id) || PERM.find(x => x.id === id);
}
function shopBuy(id) {
  const it = shopInfo(id); if (!it) return;
  if ((id === 'vip' && S.shop.vip) || (id === 'bed' && S.shop.bed)) return;
  if (S.gems < it.price) {
    showModal(`<h2>💎 Za mało klejnotów</h2><p>Potrzebujesz <b>${it.price} 💎</b>, a masz ${S.gems}.</p>
      <p class="sub">Klejnoty zdobywasz za zadania dzienne, osiągnięcia, logowanie i koło fortuny.</p><button class="btn wide" data-act="closeModal">OK</button>`);
    return;
  }
  showModal(`<h2>🛒 Zakup</h2><div style="font-size:64px">${it.e}</div><div class="big" style="font-size:20px">${it.name}</div>
    <p>Cena: <b>${it.price} 💎</b> <span class="sub">(masz ${S.gems})</span></p>
    <button class="btn blue wide" data-act="shopDo" data-arg="${id}">Kup</button><button class="btn ghost wide" data-act="closeModal">Anuluj</button>`);
}
function shopDo(id) {
  const it = shopInfo(id); if (!it || S.gems < it.price) { closeModal(); return; }
  S.gems -= it.price;
  const now = Date.now();
  switch (id) {
    case 'auto': S.shop.auto++; S.shop.autoOn = true; break;
    case 'vip': S.shop.vip = true; break;
    case 'bed': S.shop.bed = true; break;
    case 'dmg2': S.boosts.shopDmg = Math.max(now, S.boosts.shopDmg || 0) + 30 * 60000; break;
    case 'coin2': S.boosts.shopCoin = Math.max(now, S.boosts.shopCoin || 0) + 30 * 60000; break;
    case 'sack': { const a = Math.max(incomePerSec() * 7200, baseCoin(S.level) * 50); S.coins += a; toast(`+${fmt(a)} 🪙`); break; }
    case 'stones': S.stones += 20; break;
    case 'epic': giveItem(newItem(pick(SLOT_ORDER), 3)); break;
    case 'legend': giveItem(newItem(pick(SLOT_ORDER), 4)); break;
  }
  closeModal(); R.B = bonusAcc(); vibrate([30, 30, 60]);
  toast(`🛒 Kupiono: ${it.name}`, 'gold'); renderPanel();
}
function autoHit() {
  if (spikesOn()) return;
  let d = clickDamage();
  const crit = Math.random() < critChance();
  if (crit) d *= critMult();
  if (S.boosts.frenzy > Date.now()) d *= 5;
  if (R.god) d *= 1000;
  R.autoVis = (R.autoVis || 0) + 1;
  if (R.tab === 'fight' && R.autoVis % 2 === 0) {
    const p = monsterCenter();
    popText(p.x + rand(-40, 40), p.y + rand(-50, 10), '🤖' + fmt(d), crit ? 'crit' : 'auto');
    heroSwing(crit); shake();
  }
  dealDamage(d);
}

/* --- Panel testera --- */
function testerAct(a) {
  const now = Date.now(), lvl = n => { S.level = Math.max(1, n); S.maxLevelRun = Math.max(S.maxLevelRun, S.level); S.maxLevelEver = Math.max(S.maxLevelEver, S.level); R.dying = false; spawnMonster(); };
  switch (a) {
    case 'coins': S.coins += Math.max(1e4, baseCoin(S.level) * 1000); break;
    case 'gems': S.gems += 1000; break;
    case 'stones': S.stones += 100; break;
    case 'crystals': S.crystals += 10; S.crystalsTotal += 10; break;
    case 'chests': S.chests.common += 5; S.chests.rare += 5; break;
    case 'cards': S.cards = S.cards.map(c => c + 10); break;
    case 'candy': S.event.cur += 100; break;
    case 'eventcur': S.daily.date = ''; S.login.last = ''; break;
    case 'sun': if (S.uniques.sunblade) { toast('Masz już Ostrze – to unikat 1/1'); return; } giveUnique('sunblade'); break;
    case 'wup': { const w = equippedItem('weapon'); if (w) w.l = Math.min(MAX_UP, w.l + 1); break; }
    case 'legset': SLOT_ORDER.forEach(sl => { const it = newItem(sl, 4); S.items.push(it); S.equip[sl] = it.id; }); break;
    case 'clearbag': S.items = S.items.filter(it => it.u || Object.values(S.equip).includes(it.id)); break;
    case 'kill': if (!R.dying) dealDamage(S.hp + 1); break;
    case 'boss': lvl(Math.ceil((S.level + 1) / 10) * 10); break;
    case 'lvl10': lvl(S.level + 10); break;
    case 'lvl100': lvl(S.level + 100); break;
    case 'lvlm10': lvl(S.level - 10); break;
    case 'frenzy': startFrenzy(); break;
    case 'golden': S.nextGolden = 1; setTab('fight'); break;
    case 'cd': for (const k in S.skillsReady) S.skillsReady[k] = 0; break;
    case 'offline': S.lastSeen = now - 2 * 3600e3; checkOffline(); break;
    case 'god': R.god = !R.god; break;
    case 'mech': lvl(Math.max(30, Math.ceil((S.level + 1) / 10) * 10)); break;
    case 'merchant': S.merchant.next = 1; S.merchant.until = 0; merchantTick(); break;
    case 'xp': addXP(500); break;
    case 'build': if (S.village.build) S.village.build.until = 1; villageTick(); break;
    case 'luck': S.luck += 5; break;
    case 'cls': S.stats.prestiges = Math.max(1, S.stats.prestiges); S.cls = ''; break;
    case 'fuse': { const sl = pick(SLOT_ORDER); for (let i = 0; i < 3; i++) S.items.push(newItem(sl, 3)); break; }
    case 'off': S.tester = false; R.god = false; R.verTaps = 0; R.moreSub = 'settings'; break;
    default: if (a.startsWith('item')) giveItem(newItem(pick(SLOT_ORDER), +a.slice(4)));
  }
  if (a.startsWith('item') === false && !['sun', 'golden', 'offline'].includes(a)) toast('🧪 Zrobione');
  R.B = bonusAcc(); renderHero(); renderPanel();
}

/* =========================================================
   13. OKNA MODALNE (z kolejką)
   ========================================================= */
function showModal(html, opts = {}) {
  if (R.modalOpen && !opts.force) { R.modalQueue.push([html, opts]); return; }
  R.modalOpen = true;
  $('modalBox').innerHTML = html;
  $('modal').classList.remove('hidden');
}
function closeModal(skipQueue) {
  R.modalOpen = false;
  $('modal').classList.add('hidden');
  $('modalBox').innerHTML = '';
  if (skipQueue !== true && R.modalQueue.length) { const [h, o] = R.modalQueue.shift(); showModal(h, o); }
}

/* =========================================================
   14. ZAROBKI OFFLINE
   ========================================================= */
function checkOffline() {
  const now = Date.now(), gap = (now - (S.lastSeen || now)) / 1000;
  S.lastSeen = now;
  if (gap < 60) return;
  const secs = Math.min(gap, (8 + R.B.offlineH) * 3600);
  const amt = offlineRate() * secs * Math.min(1.5, 0.5 + R.B.offline);
  if (amt < 1) return;
  R.offlineAmt = amt;
  showModal(`<h2>😴 Witaj z powrotem!</h2><p>Twoi pomocnicy walczyli przez ${fmtTime(secs)}</p>
    <p>Zarobiłeś:</p><div class="big">${fmt(amt)} 🪙</div>
    <button class="btn blue wide" data-act="offlineAd">📺 ×2 za reklamę (${fmt(amt * 2)})</button>
    <button class="btn wide" data-act="offlineClaim">Odbierz</button>`);
}

/* =========================================================
   15. AKTUALIZACJE (sprawdza nową wersję pliku na GitHub Pages)
   ========================================================= */
async function checkUpdate(manual) {
  try {
    const base = location.href.split('#')[0].split('?')[0];
    if (!/^https?:/.test(base)) { if (manual) toast('Aktualizacje działają po wrzuceniu gry na GitHub Pages'); return; }
    const r = await fetch(base + '?u=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const m = txt.match(/GAME_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if (m && m[1] !== GAME_VERSION) {
      R.newVersion = m[1];
      $('updTxt').textContent = `🔄 Nowa wersja ${m[1]} jest dostępna!`;
      $('updBanner').classList.remove('hidden');
    } else if (manual) toast('✅ Masz najnowszą wersję (' + GAME_VERSION + ')');
  } catch (e) { if (manual) toast('Nie udało się sprawdzić – brak internetu?'); }
}
function doUpdate() {
  save();
  const base = location.href.split('#')[0].split('?')[0];
  location.replace(base + '?v=' + encodeURIComponent(R.newVersion || Date.now()));
}

/* =========================================================

   ========================================================= */
function updateFightUI(now) {
  setText($('coins'), fmt(S.coins));
  setText($('gems'), fmt(S.gems));
  setText($('crystals'), fmt(S.crystals));
  if (!R.cur) return;
  setText($('levelTxt'), 'Poziom ' + S.level);
  $('hpFill').style.width = Math.max(0, S.hp / R.cur.max * 100) + '%';
  setText($('hpTxt'), `❤️ ${fmt(S.hp)} / ${fmt(R.cur.max)}`);
  // Licznik bossa
  const frozen = S.boosts.freeze > now;
  $('bossBar').classList.toggle('hidden', !R.cur.boss);
  if (R.cur.boss) {
    const tot = 30 + R.B.bossT;
    $('bossFill').style.width = Math.max(0, S.bossLeft / tot * 100) + '%';
    setText($('bossTxt'), `⏱️ ${Math.max(0, S.bossLeft).toFixed(1)} s${frozen ? ' ❄️ ZAMROŻONY' : ''}`);
  }
  monsterEl.classList.toggle('frozen', frozen && R.cur.boss);
  const mb = $('mechBar'), mt = R.cur.boss && R.mech && R.mech.type;
  mb.classList.toggle('hidden', !mt);
  if (mt) {
    let txt = BOSS_MECH[mt].n + ': ', danger = false;
    if (mt === 'spikes') { const ph = spikePhase(now); danger = ph === 2; txt += ph === 2 ? '⛔ NIE KLIKAJ!' : ph === 1 ? '⚠️ Zaraz kolce…' : 'bij teraz!'; monsterEl.classList.toggle('spiky', ph === 2); monsterEl.classList.toggle('warn', ph === 1); }
    else if (mt === 'shield') { const c = R.targets.filter(t => t.type === 'crys').length; txt += c ? `rozbij kryształy 🔷 (${c}/3) – obrażenia 10%` : 'tarcza rozbita! 💥'; }
    else if (mt === 'heal') txt += Date.now() - (R.lastHitMs || 0) > 1500 ? 'leczy się – bij!' : 'nie przestawaj bić';
    else if (mt === 'minions') { const c = R.targets.filter(t => t.type === 'minion').length; txt += c ? `pokonaj sługi (${c}) – boss nietykalny` : R.mech.spawned ? 'sługi pokonane!' : 'przy 50% HP przywoła sługi'; danger = c > 0; }
    setText(mb, txt); mb.classList.toggle('danger', danger);
  } else { monsterEl.classList.remove('spiky', 'warn'); }
  // Combo / szał
  const frenzy = S.boosts.frenzy > now;
  $('app').classList.toggle('frenzy', frenzy);
  if (frenzy) {
    const left = (S.boosts.frenzy - now) / 1000;
    $('comboFill').style.width = (left / (10 + R.B.frenzyT) * 100) + '%';
    setText($('comboTxt'), `🔥 SZAŁ ×5 — ${Math.ceil(left)} s`);
  } else {
    $('comboFill').style.width = S.combo + '%';
    setText($('comboTxt'), S.combo > 1 ? `⚡ COMBO ${Math.floor(S.combo)}%` : 'Klikaj szybko, by napełnić COMBO');
  }
  // Umiejętności
  for (const id in SKILLS) {
    const el = $('sk-' + id), left = (S.skillsReady[id] - now) / 1000;
    el.querySelector('.cd').style.height = left > 0 ? (left / SKILLS[id].cd * 100) + '%' : '0';
    setText(el.querySelector('.ct'), left > 0 ? fmtTime(left) : '');
    el.classList.toggle('act', (id === 'freeze' && frozen) || (id === 'gold' && S.boosts.gold > now));
  }
  // Bonus za reklamę
  const adLeft = (S.boosts.ad - now) / 1000;
  setText($('adCnt'), `${S.daily.adBoosts}/10`);
  setText($('adLbl'), adLeft > 0 ? `×2 · ${fmtTime(adLeft)}` : '×2 obr. 3 min');
  $('adBtn').classList.toggle('act', adLeft > 0);
  // Aktywne boosty
  const chips = [];
  if (adLeft > 0) chips.push(`📺 ×2 obr. ${fmtTime(adLeft)}`);
  if (S.boosts.chest > now) chips.push(`⚡ ×3 obr. ${fmtTime((S.boosts.chest - now) / 1000)}`);
  if (S.boosts.gold > now) chips.push(`✨ ×2 monety ${fmtTime((S.boosts.gold - now) / 1000)}`);
  const dps = totalDps();
  if ((S.boosts.shopDmg || 0) > now) chips.push(`🛒 ×2 obr. ${fmtTime((S.boosts.shopDmg - now) / 1000)}`);
  if ((S.boosts.shopCoin || 0) > now) chips.push(`🛒 ×2 monety ${fmtTime((S.boosts.shopCoin - now) / 1000)}`);
  if (dps > 0) chips.push(`⚔️ DPS ${fmt(dps)}`);
  const sw = sunWeapon();
  if (sw) chips.push(sw.l >= 9 && S.boosts.frenzy > now ? '☀️ ZAĆMIENIE!' : `☀️ ${R.sun || 0}/${sw.l >= 6 ? 20 : 25}`);
  if (R.burn && R.burn.until > now) chips.push(`🔥 Podpalenie ×${R.burn.st}`);
  if (R.god) chips.push('🧪 ×1000');
  if (R.cur && R.cur.boss && R.mech && R.mech.type === 'heal' && Date.now() - (R.lastHitMs || 0) > 1500) chips.push('💚 Boss się leczy!');
  const ch = chips.map(c => `<span class="bchip">${c}</span>`).join('') + (merchantActive() ? `<span class="bchip btnchip" data-act="goMerchant">🧳 Kupiec ${fmtTime((S.merchant.until - now) / 1000)}</span>` : '') + (autoRate() ? `<span class="bchip btnchip" data-act="autoToggle">🤖 ${S.shop.autoOn ? autoRate() + '/s' : 'wył.'}</span>` : '');
  const bx = $('boosts'); if (bx._h !== ch) { bx._h = ch; bx.innerHTML = ch; }
  // Pasek do następnego ulepszenia
  const c = cheapestUpgrade();
  $('nextFill').style.width = Math.min(100, S.coins / c * 100) + '%';
  setText($('nextTxt'), S.coins >= c ? '✅ Możesz kupić ulepszenie! Dotknij' : `Do następnego ulepszenia brakuje ${fmt(c - S.coins)} 🪙`);
  // Pasek wydarzenia
  const E = currentEvent();
  $('eventBar').classList.toggle('hidden', !E);
  if (E) setText($('eventBar'), `${E.e} ${E.name}! ${E.cur} ${S.event.cur} · dotknij, by otworzyć sklep`);
}
function updateBadges() {
  $('dot-chests').classList.toggle('hidden', !(S.chests.common + S.chests.rare > 0));
  $('dot-upgrades').classList.toggle('hidden', !(S.coins >= cheapestUpgrade()));
  const d = moreDots();
  $('dot-more').classList.toggle('hidden', !(d.quests || d.login || d.wheel || d.village || d.season || d.merchant));
}

/* =========================================================
   18. GŁÓWNA PĘTLA GRY
   ========================================================= */
function tick() {
  const t = performance.now();
  let dt = (t - R.lastTick) / 1000; R.lastTick = t;
  if (dt > 1) dt = 1;
  const now = Date.now();
  R.B = bonusAcc();
  if (!R.dying && R.cur) {
    const dps = totalDps();
    if (dps > 0) {
      const mins = R.targets.filter(t => t.type === 'minion');
      if (mins.length) hitMinion(mins[0], dps * dt, true);
      else S.hp -= dps * dt * bossDmgFactor();
      R.dpsAcc += dps * dt;
      if (t - R.lastDpsPop > 1000) {
        R.lastDpsPop = t;
        if (R.tab === 'fight' && R.dpsAcc > 0) { const r = monsterCenter(); popText(r.x + rand(-50, 50), r.y + rand(-40, 20), '⚔️' + fmt(R.dpsAcc), 'dps'); }
        R.dpsAcc = 0;
      }
      if (S.hp <= 0) { S.hp = 0; kill(); }
    }
    if (R.cur.boss && !R.dying) {
      mechTick(now, dt);
      if (S.boosts.freeze <= now) S.bossLeft -= dt;
      if (S.bossLeft <= 0) bossFail();
    }
  }
  // Podpalenie z Ostrza Pożeracza Słońc
  if (R.burn && R.burn.until > now && !R.dying && R.cur) {
    const bd = R.burn.dps * R.burn.st * dt * bossDmgFactor();
    S.hp -= bd; R.burnAcc = (R.burnAcc || 0) + bd;
    if (t - (R.lastBurnPop || 0) > 700) { R.lastBurnPop = t; const p = monsterCenter(); popText(p.x + rand(-30, 30), p.y + rand(-20, 30), '🔥' + fmt(R.burnAcc), 'crit'); R.burnAcc = 0; }
    if (S.hp <= 0) { S.hp = 0; kill(); }
  }
  // Autoclicker ze sklepu
  if (autoRate() && S.shop.autoOn && !R.dying && R.cur && !R.modalOpen) {
    R.autoAcc = Math.min(3, (R.autoAcc || 0) + dt * autoRate());
    while (R.autoAcc >= 1 && !R.dying) { R.autoAcc--; autoHit(); }
  }
  // Combo opada, gdy gracz przestaje klikać
  if (S.boosts.frenzy <= now && t - R.lastTap > 400 && S.combo > 0) S.combo = Math.max(0, S.combo - 22 * dt);
  goldenTick(now);
  updateFightUI(now);
  R.secAcc += dt;
  if (R.secAcc >= 1) { R.secAcc = 0; everySecond(); }
}
function everySecond() {
  checkAchievements();
  villageTick(); merchantTick(); seasonCheck();
  if (todayKey() !== S.daily.date) newDay();
  const E = currentEvent();
  if (E && S.event.key !== E.key) S.event = { key: E.key, cur: 0 };
  if (!R.touching && !(R.spinning && R.tab === 'more')) renderPanel();
  updateBadges();
}

/* =========================================================
   19. START GRY
   ========================================================= */
function init() {
  const had = load();
  if (!S.starter) {   // startowy miecz dla nowych i starych zapisów
    const it = newItem('weapon', 0, 'sword');
    S.items.push(it); S.equip.weapon = it.id; S.starter = true;
  }
  R.B = bonusAcc();
  applySkin();
  renderHero();
  spawnMonster();
  arena.addEventListener('pointerdown', onTap);
  arena.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('pointerdown', () => { R.touching = true; }, true);
  document.addEventListener('pointerup', () => { R.touching = false; }, true);
  document.addEventListener('pointercancel', () => { R.touching = false; }, true);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
    else { R.lastTick = performance.now(); R.B = bonusAcc(); checkOffline(); checkUpdate(false); }
  });
  window.addEventListener('pagehide', () => { if (!R.noSave) save(); });
  if (had) checkOffline();
  if (todayKey() !== S.daily.date) newDay();
  if (!S.welcomed) {
    S.welcomed = true;
    showModal(`<h2>👹 Monster Tap</h2><p>Stukaj w potwora, zdobywaj monety i ulepszaj bohatera!</p>
      <p class="sub">⚡ Szybkie klikanie = SZAŁ ×5 · 👑 Co 10 poziom boss na czas · 💰 Łap złoty skarb · 🌍 Co 100 poziomów nowy świat</p>
      <button class="btn wide" data-act="closeModal">Graj!</button>`);
  }
  const E = currentEvent();
  if (E && S.event.key !== E.key) S.event = { key: E.key, cur: 0 };
  setTab('fight');
  setInterval(tick, 100);
  setInterval(() => { if (!R.noSave) save(); }, 10000);   // autozapis co 10 s
  setTimeout(() => checkUpdate(false), 3000);
  setInterval(() => checkUpdate(false), 15 * 60 * 1000);
}
init();

/* Rejestracja service workera – potrzebna do instalacji gry jako aplikacji */
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e)); });
}
</script>
